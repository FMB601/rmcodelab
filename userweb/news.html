<body>

  <a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: white;">

</div>

  <section class="page-banner">
    <h1>News &amp; Announcements</h1>
    <p>Keep up with new lessons, platform updates, and academy announcements.</p>

  <main class="section">
    <div class="grid-container" id="news-list">
      <p>Loading announcements...</p>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAalxUPuYwF556UN32_-SLxEIirmeI7JIM",
      authDomain: "html-project-fac38.firebaseapp.com",
      projectId: "html-project-fac38",
      storageBucket: "html-project-fac38.firebasestorage.app",
      messagingSenderId: "396617400947",
      appId: "1:396617400947:web:abbba7be1586e5b9c66006",
      measurementId: "G-XJRN8JB1YK"
    };

    window.db = getFirestore(initializeApp(firebaseConfig));
    window.collection = collection;
    window.getDocs = getDocs;
    window.doc = doc;
    window.getDoc = getDoc;
  </script>
  <script src="data.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('news-list');
      let announcements = [];
      if (window.academyLocal) {
        announcements = window.academyLocal.news();
      }

      try {
        if (window.db && window.getDocs && window.collection) {
          const snapshot = await window.getDocs(window.collection(window.db, 'news'));
          snapshot.forEach((doc) => announcements.push(doc.data()));
        }
      } catch (error) {
        console.log('Firestore unavailable; using data.js:', error);
      }

      if (!announcements.length && window.academyLocal) {
        announcements = window.academyLocal.news();
      }

      if (!announcements.length && typeof academyData !== 'undefined') {
        announcements = academyData.announcements || [];
      }

      container.innerHTML = announcements.length ? announcements.map((item) => `
        <article class="course-card">
          <small style="color: #64748b;">${escapeHtml(item.date || 'Announcement')}</small>
          <h2 style="margin-top: 0.5rem;">${escapeHtml(item.title || 'Academy update')}</h2>
          <p style="margin-top: 0.8rem; color: #64748b;">${escapeHtml(item.content || item.desc || item.description || '')}</p>
          ${item.pdfUrl ? `<a class="btn-primary" style="margin-top: 1rem;" href="${escapeAttribute(item.pdfUrl)}" target="_blank" rel="noopener noreferrer">Open document</a>` : ''}
        </article>
      `).join('') : '<p>No announcements are available right now.</p>';
    });

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, (character) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[character]));
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replace(/javascript:/gi, '');
    }
  </script>

  <!-- Bottom Running Announcement Ticker -->
<div class="ticker-container">
  <div class="ticker-text" id="running-ticker">Loading RMCodeLab announcements...</div>
</div>

</body>
</html>
