<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - RMCodeLab Academy</title>
  <link rel="stylesheet" href="../userweb/style.css?v=5">
  <style>
    .admin-container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }
    .admin-card {
      background: rgba(255, 255, 255, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.55);
      padding: 2rem;
      border-radius: 10px;
      margin-bottom: 2rem;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.16);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .admin-card h3 {
      margin-bottom: 1.2rem;
      color: #0f172a;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 0.5rem;
    }
    .form-group {
      margin-bottom: 1.2rem;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: #334155;
    }
    .form-group input, 
    .form-group textarea, 
    .form-group select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
    }
    .form-group input:focus, 
    .form-group textarea:focus, 
    .form-group select:focus {
      border-color: #0070f3;
    }
    .btn-submit {
      width: 100%;
      border: none;
      cursor: pointer;
      font-size: 1rem;
    }
    .content-list { display: grid; gap: 0.75rem; }
    .content-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0.8rem; border: 1px solid #e2e8f0; border-radius: 6px; }
    .content-row strong { color: #0f172a; }
    .content-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
    .btn-small { border: 0; border-radius: 5px; padding: 0.45rem 0.7rem; cursor: pointer; color: white; font-weight: 600; }
    .btn-edit { background: #0ea5e9; }
    .btn-delete { background: #dc2626; }

    @media (max-width: 600px) {
      .admin-container { margin: 1rem auto; padding: 0 0.75rem; }
      .admin-card { padding: 1.1rem; }
      .admin-card h3 { font-size: 1.05rem; }
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="logo">
      <a href="../userweb/index.html">
        <img src="../userweb/images/logo.png" alt="RMCodeLab Logo" class="nav-logo" onerror="this.style.display='none'">
        <h2>RM<span>CodeLab</span> Admin</h2>
      </a>
    </div>
    <a href="../userweb/index.html" class="btn-secondary" style="color: white; border-color: white;">View Site</a>
  </header>

  <div class="admin-container">
    <div id="operation-status" role="status" aria-live="polite" style="display:none; margin-bottom:1rem; padding:0.9rem 1rem; border-radius:6px; font-weight:600;"></div>
    
    <!-- 1. Running Ticker Text -->
    <div class="admin-card">
      <h3>1. Manage Bottom Announcement Ticker</h3>
      <div class="form-group">
        <label for="ticker-input">Walking Text (Sentence):</label>
        <input type="text" id="ticker-input" placeholder="e.g., Welcome to RMCodeLab Academy! New Level 5 courses published. Enroll now!">
      </div>
      <button class="btn-primary btn-submit" id="btn-save-ticker" type="button">Update Announcement Ticker</button>
    </div>

    <!-- 2. Course Levels Management -->
    <div class="admin-card">
      <h3>2. Update Course Level & Video Link</h3>
      <div class="form-group">
        <label for="course-level">Select Level to Edit:</label>
        <select id="course-level">
          <option value="1">Level 1: Web Basics (HTML & CSS)</option>
          <option value="2">Level 2: Modern CSS & Flexbox/Grid</option>
          <option value="3">Level 3: JavaScript Core Fundamentals</option>
          <option value="4">Level 4: Advanced JS & Async Programming</option>
          <option value="5">Level 5: Git, GitHub & Version Control</option>
          <option value="6">Level 6: Frontend Frameworks (Astro / React)</option>
          <option value="7">Level 7: Backend Basics & Node.js</option>
          <option value="8">Level 8: Database Integration (Firebase & SQL)</option>
          <option value="9">Level 9: Fullstack App Architecture</option>
          <option value="10">Level 10: Desktop Systems & VBA Automation</option>
          <option value="11">Level 11: Video Production & Media Workflows</option>
          <option value="12">Level 12: Capstone Project & Cloud Deployment</option>
        </select>
      </div>
      <div class="form-group">
        <label for="course-title">Course Title:</label>
        <input type="text" id="course-title" placeholder="e.g., Level 1: Web Basics (HTML & CSS)">
      </div>
      <div class="form-group">
        <label for="course-desc">Description:</label>
        <textarea id="course-desc" rows="3" placeholder="Course overview and objectives..."></textarea>
      </div>
      <div class="form-group">
        <label for="course-video">Video Link (YouTube URL or Embed):</label>
        <input type="text" id="course-video" placeholder="https://www.youtube.com/watch?v=...">
      </div>
      <div class="form-group">
        <label for="course-image">Cover Image Path:</label>
        <input type="text" id="course-image" placeholder="images/level1.jpg">
      </div>
      <button class="btn-primary btn-submit" id="btn-save-course" type="button">Save / Update Course Level</button>
    </div>

    <!-- 3. News & Announcements Management -->
    <div class="admin-card">
      <h3>3. Publish News & Announcement</h3>
      <div class="form-group">
        <label for="news-title">Headline / Title:</label>
        <input type="text" id="news-title" placeholder="e.g., New Web Development Bootcamp Registration Open">
      </div>
      <div class="form-group">
        <label for="news-content">Full News Content:</label>
        <textarea id="news-content" rows="4" placeholder="Write the announcement details here..."></textarea>
      </div>
      <button class="btn-primary btn-submit" id="btn-save-news" type="button">Publish Announcement</button>
    </div>

    <div class="admin-card">
      <h3>4. Manage Published Content</h3>
      <button class="btn-small btn-delete" id="btn-delete-all-news" type="button" style="margin-bottom: 1rem;">Delete All Announcements</button>
      <div class="content-list" id="admin-content-list">
        <p>Loading saved content...</p>
      </div>
    </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
  <script src="admin-script.js"></script>
</body>
</html>
